plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ps5translator'
version = '0.2.0'

def architectures = (findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,arm64-v8a,x86,x86_64').split(',')

android {
  namespace "expo.modules.ps5translator"
  ndkVersion "28.2.13676358"
  sourceSets.main.assets.srcDir "../../../licenses"
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }
  defaultConfig {
    ndk { abiFilters(*architectures) }
    versionCode 2
    versionName "0.2.0"
  }
}

dependencies {
  // Existing TV WebSocket server, unchanged.
  implementation "org.java-websocket:Java-WebSocket:1.6.0"
  // On-device Latin-script text recognition. No image upload required.
  implementation "com.google.mlkit:text-recognition:16.0.1"
  implementation "com.google.mlkit:translate:17.0.3"
}
