
name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Bağımlılıkları yükle
        working-directory: frontend
        run: yarn install --ignore-scripts --non-interactive

      - name: Android projesini oluştur
        working-directory: frontend
        run: npx expo prebuild --platform android --non-interactive

      - name: APK oluştur
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: PS5-Cevirmen-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
