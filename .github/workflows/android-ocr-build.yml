name: Android OCR APK build
on:
  workflow_dispatch:
  push:
    branches:
      - feature/screen-ocr-foundation
    paths:
      - 'frontend/**'
      - '.github/workflows/android-ocr-build.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install JS dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ps5ceviri-ocr-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
