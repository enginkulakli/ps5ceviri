name: Android OCR APK build
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/screen-ocr-foundation
      - feature/ps5-remote-play-subtitles
      - feature/v2-fullscreen-translation
    paths:
      - 'frontend/**'
      - 'third_party/chiaki-ng'
      - '.gitmodules'
      - '.github/workflows/android-ocr-build.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK and native build dependencies
        run: |
          sdk="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            mkdir -p "$sdk/cmdline-tools"
            curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$RUNNER_TEMP/android-commandline.zip"
            unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$sdk/cmdline-tools"
            mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          fi
          (set +o pipefail; yes | "$sdkmanager" --sdk_root="$sdk" --licenses)
          "$sdkmanager" --sdk_root="$sdk" --channel=3 --install \
            'platforms;android-37.0' 'build-tools;37.0.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/ps5-protobuf"
          "$RUNNER_TEMP/ps5-protobuf/bin/pip" install grpcio-tools==1.85.3
          ln -s python-grpc-tools-protoc "$RUNNER_TEMP/ps5-protobuf/bin/protoc"
          echo "$RUNNER_TEMP/ps5-protobuf/bin" >> "$GITHUB_PATH"
          if grep -q 'third_party/chiaki-ng' .gitmodules 2>/dev/null; then
            git submodule update --init --depth 1 third_party/chiaki-ng
            git -C third_party/chiaki-ng submodule update --init --depth 1 \
              third-party/nanopb third-party/jerasure third-party/gf-complete third-party/curl
          fi
      - name: Install JS dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Generate Android project
        working-directory: frontend
        run: CI=1 npx expo prebuild --platform android
      # Samsung Android 16 rejects some R8-optimized service bytecode with VerifyError.
      # Keep release JS bundling, but disable R8 minification for this test build.
      - name: Disable release bytecode shrinking (fix VerifyError)
        working-directory: frontend/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          original = s
          s, count = re.subn(r"minifyEnabled\s+[^\n]+", "minifyEnabled false", s)
          if count < 1:
              raise SystemExit("Cannot find minifyEnabled in generated app/build.gradle")
          s = re.sub(r"shrinkResources\s+[^\n]+", "shrinkResources false", s)
          p.write_text(s)
          print(f"Disabled R8 in {count} build type(s)")
          PY
      # Debug APK expects Metro on a developer computer and may remain on the splash screen.
      # Release APK embeds the JavaScript bundle and runs without Metro.
      - name: Build standalone release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if ./gradlew :app:assembleRelease --stacktrace -PreactNativeArchitectures=arm64-v8a; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ps5ceviri-standalone-arm64-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
